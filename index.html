    <script>
      // No-flash theme bootstrap: reads saved choice and applies it before
      // React mounts so users never see a flicker. Defaults to dark when no
      // choice has been saved (regardless of system preference).
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
